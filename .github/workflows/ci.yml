name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/runtime-cache@v2
      
      - name: Build
        run: cargo build --release
      
      - name: Run tests
        run: cargo test

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Build release
        run: |
          cargo build --release
          cd target/release
          tar czf abox-x86_64-unknown-linux-gnu.tar.gz abox
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: target/release/abox-x86_64-unknown-linux-gnu.tar.gz
