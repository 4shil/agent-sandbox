name: Build Linux Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          
      - name: Install frontend dependencies
        working-directory: ./gui
        run: npm install
        
      - name: Build Tauri AppImage & Deb
        working-directory: ./gui
        run: npm run tauri build
        
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: abox-linux-x86_64.AppImage
          path: gui/src-tauri/target/release/bundle/appimage/*.AppImage
          
      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: abox-linux-amd64.deb
          path: gui/src-tauri/target/release/bundle/deb/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          
      - name: Install frontend dependencies
        working-directory: ./gui
        run: npm install
        
      - name: Build RPM
        working-directory: ./gui
        run: npm run tauri build -- --bundles rpm
        
      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: abox-linux-x86_64.rpm
          path: gui/src-tauri/target/release/bundle/rpm/*.rpm

  release:
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            abox-linux-x86_64.AppImage/*
            abox-linux-amd64.deb/*
            abox-linux-x86_64.rpm/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
