[package]
name = "abox-gui"
version = "0.1.0"
description = "GUI for agent-sandbox"
authors = ["Ashil"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reuse existing abox crates - will be added after refactoring
# abox-core = { path = "../../src/core" }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
