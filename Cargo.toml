[package]
name = "abox"
version = "1.0.0"
edition = "2021"
description = "sandbox for AI coding agents"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
colored = "2"
which = "7"
ratatui = "0.28"
crossterm = "0.28"
tui-textarea = "0.7"
tui-tree-widget = "0.3"
sysinfo = "0.32"
indicatif = "0.17"
dialoguer = "0.11"
open = "5"
