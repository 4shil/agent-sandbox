[package]
name = "abox"
version = "1.0.0"
edition = "2021"
description = "sandbox for AI coding agents"
license = "MIT"

[workspace]
members = [".", "core"]

[dependencies]
agent-sandbox-core = { path = "./core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
colored = "2"
which = "7"
ratatui = "0.28"
crossterm = "0.28"
tui-textarea = "0.7"
tui-tree-widget = "0.3"
indicatif = "0.17"
dialoguer = "0.11"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
