[package]
name = "abox"
version = "0.5.0"
edition = "2021"
description = "🛡️  Invisible sandbox for AI coding agents"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
