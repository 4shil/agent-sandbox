[package]
name = "abox"
version = "0.2.0"
edition = "2021"
description = "🛡️ Isolated, Auditable, Portable AI Agent Runtime"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tar = "0.4"
flate2 = "1"
walkdir = "2"
colored = "2"
which = "7"
