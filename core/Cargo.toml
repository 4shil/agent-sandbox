[package]
name = "agent-sandbox-core"
version = "0.1.0"
edition = "2021"
description = "Core library for agent-sandbox: session, sandbox, recorder, and db modules"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
sysinfo = "0.32"
colored = "2"
which = "7"
